version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: golang_mvc_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - APP_NAME=Golang-MVC-API
      - APP_ENV=production
      - APP_PORT=8080
      - DB_DRIVER=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=golang_template_db
      - DB_SSLMODE=disable
      - JWT_SECRET=change_this_to_a_secure_random_key_in_production
      - JWT_EXPIRATION_HOURS=72
      - CORS_ALLOWED_ORIGINS=*
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: golang_mvc_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: golang_template_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d golang_template_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
